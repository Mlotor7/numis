<style>
#numisAuthGate{position:fixed;inset:0;z-index:99999;background:rgba(246,247,249,.97);display:flex;align-items:center;justify-content:center;padding:20px}
#numisAuthGate .auth-box{width:min(420px,100%);background:#fff;border:1px solid #e2e6e8;border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(23,33,43,.12)}
#numisAuthGate h2{margin:0 0 7px;font-size:26px;color:#111}
#numisAuthGate p{margin:0 0 20px;color:#68727b;font-size:14px;line-height:1.5}
#numisAuthGate label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px;color:#343a40}
#numisAuthGate input{width:100%;padding:12px 13px;border:1px solid #d9dee2;border-radius:11px;font:inherit;outline:none}
#numisAuthGate input:focus{border-color:#174f46;box-shadow:0 0 0 3px rgba(23,79,70,.08)}
#numisAuthGate .auth-actions{display:flex;gap:9px;margin-top:18px}
#numisAuthGate button{flex:1;border:1px solid #d9dee2;background:#fff;border-radius:11px;padding:11px 13px;font-weight:700;cursor:pointer}
#numisAuthGate button.primary{background:#174f46;color:#fff;border-color:#174f46}
#numisAuthGate .auth-msg{margin-top:12px;font-size:12px;color:#68727b;min-height:18px}
#numisAuthGate .auth-brand{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#174f46;margin-bottom:10px}
#numisUserBar{position:fixed;right:18px;top:14px;z-index:1000;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e1e5e7;border-radius:999px;padding:5px 7px 5px 12px;box-shadow:0 6px 20px rgba(23,33,43,.07);font-size:12px;color:#4f5961}
#numisUserBar button{border:0;background:#f1f3f4;border-radius:999px;padding:6px 10px;cursor:pointer;font-weight:700;color:#333}.cloud-status{font-size:10px;font-weight:800;color:#4d625c;white-space:nowrap}
@media(max-width:700px){#numisUserBar{right:10px;top:10px}.main{padding-top:54px}}
</style>
</head>
<body>
<div id="numisAuthGate">
  <div class="auth-box">
    <div class="auth-brand">Numis</div>
    <h2>Accede a Numis</h2>
    <p>Inicia sesión para acceder a tu catálogo y a tu colección desde cualquier dispositivo.</p>
    <label for="numisAuthEmail">Correo electrónico</label>
    <input id="numisAuthEmail" type="email" autocomplete="email" placeholder="tu@email.com">
    <label for="numisAuthPassword">Contraseña</label>
    <input id="numisAuthPassword" type="password" autocomplete="current-password" placeholder="Tu contraseña">
    <div class="auth-actions">
      <button class="primary" type="button" onclick="cloudSignIn()">Iniciar sesión</button>
      <button type="button" onclick="cloudSignUp()">Crear cuenta</button>
    </div>
    <div id="numisAuthMsg" class="auth-msg"></div>
  </div>
</div>
<div id="numisUserBar"><span id="numisCloudStatus" class="cloud-status"></span><span id="numisUserLabel"></span><button type="button" onclick="cloudSyncNow()">Sincronizar</button><button type="button" onclick="cloudSignOut()">Cerrar sesión</button></div>
<div class="app">
<aside class="side"><div class="brand"><span>Numis</span></div><div class="nav">
<button class="active" onclick="show('home',this)"><span id="navHome">Inicio</span></button>
<button onclick="show('catalog',this)"><span id="navCatalog">Catálogo</span></button>
<button onclick="show('collection',this)"><span id="navCollection">Mi colección</span></button>
<button onclick="show('missing',this)"><span id="navMissing">Necesito</span></button>
<button onclick="show('favorites',this)"><span id="navFavorites">Favoritas</span></button>
<button onclick="show('excluded',this)"><span id="navExcluded">Monedas excluidas</span></button>
<button onclick="show('cost',this)"><span id="navCost">Coste de mi colección</span></button>
<button class="admin" onclick="show('admin')"><span id="navAdmin">Administración</span></button>
</div></aside><main class="main" id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ECB_URL="https://www.ecb.europa.eu/euro/coins/comm/html/index.es.html";

// =========================================================
// NUMIS CLOUD · Supabase
// =========================================================
const NUMIS_SUPABASE_URL="https://xhmrfvfrfjkoitezndsh.supabase.co";
const NUMIS_SUPABASE_KEY="sb_publishable_5Z7Q6c5TUzsbpZARnskXcw_Yqrs4UPE";
const NUMIS_DB=window.supabase.createClient(NUMIS_SUPABASE_URL,NUMIS_SUPABASE_KEY);
let numisCloudReady=false;
let numisCloudSession=null;
let numisCloudProfile=null;
let numisCloudSaving=false;
let numisCloudSaveQueued=false;
const NUMIS_CLOUD_MIGRATION_KEY='numis_cloud_migration_v1';

function cloudMsg(text){const el=document.getElementById('numisAuthMsg');if(el)el.textContent=text||''}
function showAuthGate(show=true){const el=document.getElementById('numisAuthGate');if(el)el.style.display=show?'flex':'none'}
function updateAuthUI(){
  const admin=document.querySelector('.nav .admin');
  if(admin)admin.style.display=numisCloudProfile?.role==='admin'?'':'none';
  const bar=document.getElementById('numisUserBar'),label=document.getElementById('numisUserLabel'),status=document.getElementById('numisCloudStatus');
  if(bar)bar.style.display=numisCloudSession?'flex':'none';
  if(label)label.textContent=numisCloudSession?.user?.email||'';
  if(status){status.textContent=numisCloudReady?'● Sincronizado':'○ Conectando…';status.title=numisCloudReady?'Numis está conectado a la nube.':'Numis está conectando con la nube.';status.dataset.ready=numisCloudReady?'1':'0';}
}
function cloudRequireAuth(){if(!numisCloudSession){showAuthGate(true);return false}return true}

async function cloudSignIn(){
  const email=document.getElementById('numisAuthEmail')?.value.trim();
  const password=document.getElementById('numisAuthPassword')?.value||'';
  if(!email||!password){cloudMsg('Introduce correo y contraseña.');return}
  cloudMsg('Iniciando sesión…');
  const {error}=await NUMIS_DB.auth.signInWithPassword({email,password});
  if(error){cloudMsg(error.message||'No se pudo iniciar sesión.');return}
  cloudMsg('');
  await cloudStartAfterAuth();
}
async function cloudSignUp(){
  const email=document.getElementById('numisAuthEmail')?.value.trim();
  const password=document.getElementById('numisAuthPassword')?.value||'';
  if(!email||password.length<6){cloudMsg('Introduce un correo y una contraseña de al menos 6 caracteres.');return}
  cloudMsg('Creando cuenta…');
  const {data,error}=await NUMIS_DB.auth.signUp({email,password});
  if(error){cloudMsg(error.message||'No se pudo crear la cuenta.');return}
  if(!data.session){cloudMsg('Cuenta creada. Si Supabase solicita confirmar el correo, hazlo y después inicia sesión.');return}
  cloudMsg('');
  await cloudStartAfterAuth();
}
async function cloudSignOut(){
  await NUMIS_DB.auth.signOut();
  numisCloudReady=false;numisCloudSession=null;numisCloudProfile=null;
  updateAuthUI();showAuthGate(true);
}

async function cloudGetProfile(){
  const uid=numisCloudSession?.user?.id;if(!uid)return null;
  const {data,error}=await NUMIS_DB.from('profiles').select('id,display_name,role').eq('id',uid).maybeSingle();
  if(error)throw error;
  return data;
}

function cloudCoinRow(c,countryId=null,periodId=null){
  const base={
    id:String(c.id),country_id:countryId,period_id:periodId,
    country:c.country||null,year:Number.isFinite(Number(c.year))?Number(c.year):null,
    years:c.years||null,denomination:c.denomination||c.value||null,currency:c.currency||null,
    motif:c.motif||'',description:c.description||'',mintage:c.mintage??null,
    issue_date:c.issueDate||null,mint:c.mint||'',designer:c.designer||'',
    era:c.era||'',period:c.period||'',coin_type:c.coinType||'',subgroup:c.subgroup||'',
    obverse_image:c.obverse||'',reverse_image:c.reverse||'',source:c.source||'',source_url:c.sourceUrl||'',
    data:c
  };
  return base;
}
function cloudFromCoinRow(r){
  const x=(r&&r.data&&typeof r.data==='object')?{...r.data}: {};
  x.id=String(r.id);
  if(r.country!==null)x.country=r.country;
  if(r.year!==null)x.year=r.year;
  if(r.denomination!==null)x.denomination=r.denomination;
  if(r.currency!==null)x.currency=r.currency;
  if(r.motif!==null)x.motif=r.motif;
  if(r.description!==null)x.description=r.description;
  if(r.mintage!==null)x.mintage=r.mintage;
  if(r.issue_date!==null)x.issueDate=r.issue_date;
  if(r.mint!==null)x.mint=r.mint;
  if(r.designer!==null)x.designer=r.designer;
  if(r.era!==null)x.era=r.era;
  if(r.period!==null)x.period=r.period;
  if(r.coin_type!==null)x.coinType=r.coin_type;
  if(r.subgroup!==null)x.subgroup=r.subgroup;
  if(r.obverse_image!==null)x.obverse=r.obverse_image;
  if(r.reverse_image!==null)x.reverse=r.reverse_image;
  if(r.source!==null)x.source=r.source;
  if(r.source_url!==null)x.sourceUrl=r.source_url;
  return x;
}

async function cloudEnsureCatalog(){
  const {data:existing,error}=await NUMIS_DB.from('coins').select('id').limit(1);
  if(error)throw error;
  if(existing&&existing.length)return false;
  if(numisCloudProfile?.role!=='admin')return false;

  // First administrator seeds the cloud catalog from the complete V79 catalog.
  const countryNames=[...new Set(coins.map(c=>String(c.country||'').trim()).filter(Boolean))];
  if(countryNames.length){
    const rows=countryNames.map(name=>({name,iso_code:(typeof NUMIS_COUNTRY_ISO!=='undefined'?NUMIS_COUNTRY_ISO[name]||null:null),flag_code:(typeof flagByCountry!=='undefined'?flagByCountry[name]||null:null)}));
    const {error:e}=await NUMIS_DB.from('countries').upsert(rows,{onConflict:'name'});
    if(e)throw e;
  }
  const {data:countryRows,error:ce}=await NUMIS_DB.from('countries').select('id,name');
  if(ce)throw ce;
  const countryMap=new Map((countryRows||[]).map(x=>[x.name,x.id]));

  // Seed managed periods if available.
  const pRows=[];
  if(typeof periodAdminData!=='undefined'){
    normalizePeriodDefs();
    Object.entries(periodAdminData).forEach(([country,defs])=>{
      (defs||[]).forEach(p=>pRows.push({
        country_id:countryMap.get(country)||null,name:p.era,start_year:p.start,end_year:p.end,
        currency:p.currency||null,denominations:p.denominations||[],sort_order:Number(p.order)||0
      }));
    });
  }
  if(pRows.length){
    const {error:pe}=await NUMIS_DB.from('periods').insert(pRows);
    if(pe)console.warn('No se pudieron sembrar algunos períodos:',pe.message);
  }
  const {data:periodRows}=await NUMIS_DB.from('periods').select('id,country_id,name,start_year,end_year');
  const periodMap=new Map((periodRows||[]).map(p=>[`${p.country_id}|${p.name}|${p.start_year}-${p.end_year}`,p.id]));

  const rows=coins.map(c=>{
    let pid=null;
    const cid=countryMap.get(c.country);
    if(cid&&c.era&&c.period){
      const m=String(c.period).match(/^(\d{4})-(\d{4})$/);
      if(m)pid=periodMap.get(`${cid}|${c.era}|${m[1]}-${m[2]}`)||null;
    }
    return cloudCoinRow(c,cid,pid);
  });
  for(let i=0;i<rows.length;i+=300){
    const {error:e}=await NUMIS_DB.from('coins').upsert(rows.slice(i,i+300),{onConflict:'id'});
    if(e)throw e;
  }
  return true;
}

async function cloudLoadCatalog(){
  const {data,error}=await NUMIS_DB.from('coins').select('*');
  if(error)throw error;
  if(data&&data.length)coins=data.map(cloudFromCoinRow);
}
async function cloudLoadUserData(){
  const uid=numisCloudSession?.user?.id;if(!uid)return;
  const [col,fav,exc,excc,notes,meta]=await Promise.all([
    NUMIS_DB.from('user_collection').select('coin_id').eq('user_id',uid),
    NUMIS_DB.from('user_favorites').select('coin_id').eq('user_id',uid),
    NUMIS_DB.from('user_excluded_coins').select('coin_id').eq('user_id',uid),
    NUMIS_DB.from('user_excluded_countries').select('country_id').eq('user_id',uid),
    NUMIS_DB.from('user_coin_notes').select('coin_id,note').eq('user_id',uid),
    NUMIS_DB.from('collection_meta').select('data').eq('user_id',uid).maybeSingle()
  ]);
  for(const r of [col,fav,exc,excc,notes,meta])if(r.error)throw r.error;
  have=(col.data||[]).map(x=>String(x.coin_id));
  favorites=new Set((fav.data||[]).map(x=>String(x.coin_id)));
  excludedCoins=new Set((exc.data||[]).map(x=>String(x.coin_id)));
  coinNotes={};(notes.data||[]).forEach(x=>{coinNotes[String(x.coin_id)]={text:x.note||''}});
  collectionMeta=(meta.data?.data&&typeof meta.data.data==='object')?meta.data.data:{};
  // Country exclusions are stored by country name in the legacy UI.
  if((excc.data||[]).length){
    const ids=(excc.data||[]).map(x=>x.country_id).filter(Boolean);
    if(ids.length){
      const {data:cs,error:e}=await NUMIS_DB.from('countries').select('id,name').in('id',ids);
      if(e)throw e;excludedCountries=new Set((cs||[]).map(x=>x.name));
    }else excludedCountries=new Set();
  }else excludedCountries=new Set();
}
async function cloudUserDataEmpty(){
  const uid=numisCloudSession?.user?.id;if(!uid)return true;
  const checks=await Promise.all([
    NUMIS_DB.from('user_collection').select('user_id',{count:'exact',head:true}).eq('user_id',uid),
    NUMIS_DB.from('user_favorites').select('user_id',{count:'exact',head:true}).eq('user_id',uid),
    NUMIS_DB.from('user_excluded_coins').select('user_id',{count:'exact',head:true}).eq('user_id',uid),
    NUMIS_DB.from('user_excluded_countries').select('user_id',{count:'exact',head:true}).eq('user_id',uid),
    NUMIS_DB.from('user_coin_notes').select('user_id',{count:'exact',head:true}).eq('user_id',uid),
    NUMIS_DB.from('collection_meta').select('user_id',{count:'exact',head:true}).eq('user_id',uid)
  ]);
  for(const r of checks)if(r.error)throw r.error;
  return checks.every(r=>(r.count||0)===0);
}
async function cloudLoadPeriods(){
  const {data,error}=await NUMIS_DB.from('periods').select('country_id,name,start_year,end_year,currency,denominations,sort_order,countries(name)').order('sort_order',{ascending:true});
  if(error)throw error;
  if(!data?.length)return;
  const defs={};
  for(const r of data){const country=r.countries?.name;if(!country)continue;(defs[country]||(defs[country]=[])).push({id:`${NUMIS_COUNTRY_ISO[country]||country}-${r.start_year}-${r.end_year}-${String(r.name).replace(/[^a-z0-9]+/gi,'-')}`,era:r.name,start:r.start_year,end:r.end_year,currency:r.currency||'',denominations:Array.isArray(r.denominations)?r.denominations:[],order:Number(r.sort_order)||0})}
  periodAdminData=defs;normalizePeriodDefs();try{localStorage.setItem(PERIODS_KEY,JSON.stringify(periodAdminData))}catch{}
}
async function cloudSavePeriods(){
  if(numisCloudProfile?.role!=='admin')return;
  normalizePeriodDefs();
  const {error:del}=await NUMIS_DB.from('periods').delete().neq('id',0);
  if(del)throw del;
  const countryNames=Object.keys(periodAdminData);
  if(!countryNames.length)return;
  const {data:cs,error:ce}=await NUMIS_DB.from('countries').select('id,name').in('name',countryNames);
  if(ce)throw ce;
  const cmap=new Map((cs||[]).map(x=>[x.name,x.id]));
  const rows=[];
  for(const [country,defs] of Object.entries(periodAdminData))for(const p of (defs||[])){
    const cid=cmap.get(country);if(!cid)continue;
    rows.push({country_id:cid,name:p.era,start_year:p.start,end_year:p.end,currency:p.currency||null,denominations:p.denominations||[],sort_order:Number(p.order)||0});
  }
  for(let i=0;i<rows.length;i+=300){const {error}=await NUMIS_DB.from('periods').insert(rows.slice(i,i+300));if(error)throw error}
}

async function cloudSaveUserData(){
  const uid=numisCloudSession?.user?.id;if(!uid)return;
  await NUMIS_DB.from('user_collection').delete().eq('user_id',uid);
  if(have.length){
    const rows=have.map(id=>({user_id:uid,coin_id:String(id),quantity:1,years_owned:collectionMeta[id]?.issueYears||[]}));
    const {error}=await NUMIS_DB.from('user_collection').insert(rows);if(error)throw error;
  }
  await NUMIS_DB.from('user_favorites').delete().eq('user_id',uid);
  if(favorites.size){
    const {error}=await NUMIS_DB.from('user_favorites').insert([...favorites].map(id=>({user_id:uid,coin_id:String(id)})));if(error)throw error;
  }
  await NUMIS_DB.from('user_excluded_coins').delete().eq('user_id',uid);
  if(excludedCoins.size){
    const {error}=await NUMIS_DB.from('user_excluded_coins').insert([...excludedCoins].map(id=>({user_id:uid,coin_id:String(id)})));if(error)throw error;
  }
  await NUMIS_DB.from('user_excluded_countries').delete().eq('user_id',uid);
  if(excludedCountries.size){
    const {data:cs,error:e}=await NUMIS_DB.from('countries').select('id,name').in('name',[...excludedCountries]);
    if(e)throw e;
    if(cs?.length){
      const {error}=await NUMIS_DB.from('user_excluded_countries').insert(cs.map(x=>({user_id:uid,country_id:x.id})));if(error)throw error;
    }
  }
  const {error:me}=await NUMIS_DB.from('collection_meta').upsert({user_id:uid,data:collectionMeta,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(me)throw me;
  await NUMIS_DB.from('user_coin_notes').delete().eq('user_id',uid);
  const ns=Object.entries(coinNotes).filter(([,v])=>v?.text).map(([id,v])=>({user_id:uid,coin_id:String(id),note:String(v.text),updated_at:new Date().toISOString()}));
  if(ns.length){const {error}=await NUMIS_DB.from('user_coin_notes').insert(ns);if(error)throw error}
}
async function cloudSaveCatalog(){
  if(numisCloudProfile?.role!=='admin')return;
  const {data:dbCoins,error:qe}=await NUMIS_DB.from('coins').select('id');if(qe)throw qe;
  const current=new Set(coins.map(c=>String(c.id)));
  const stale=(dbCoins||[]).map(x=>String(x.id)).filter(id=>!current.has(id));
  for(let i=0;i<stale.length;i+=100)await NUMIS_DB.from('coins').delete().in('id',stale.slice(i,i+100));
  const rows=coins.map(c=>cloudCoinRow(c));
  for(let i=0;i<rows.length;i+=300){
    const {error}=await NUMIS_DB.from('coins').upsert(rows.slice(i,i+300),{onConflict:'id'});
    if(error)throw error;
  }
}
async function cloudFlush(){
  if(!numisCloudReady||numisCloudSaving)return;
  numisCloudSaving=true;numisCloudSaveQueued=false;
  try{
    await cloudSaveUserData();
    if(numisCloudProfile?.role==='admin'){await cloudSavePeriods();await cloudSaveCatalog();}
    window.__numisLastCloudSync=Date.now();
    updateAuthUI();
  }catch(e){console.warn('Numis cloud save:',e)}
  finally{numisCloudSaving=false;if(numisCloudSaveQueued)cloudFlush()}
}
function queueCloudSave(){if(!numisCloudReady)return;numisCloudSaveQueued=true;clearTimeout(window.__numisCloudTimer);window.__numisCloudTimer=setTimeout(cloudFlush,450)}
async function cloudSyncNow(){
  if(!numisCloudSession)return;
  try{
    cloudMsg('Sincronizando…');
    await cloudFlush();
    await cloudLoadCatalog();
    await cloudLoadPeriods();
    await cloudLoadUserData();
    cloudMsg('Sincronizado correctamente.');
    updateAuthUI();
    renderCurrentPage();
    setTimeout(()=>cloudMsg(''),2200);
  }catch(e){
    console.error(e);
    cloudMsg('No se pudo sincronizar ahora: '+(e.message||'error'));
  }
}

async function cloudStartAfterAuth(){
  try{
    const {data:{session}}=await NUMIS_DB.auth.getSession();
    if(!session){showAuthGate(true);return}
    numisCloudSession=session;
    numisCloudProfile=await cloudGetProfile();
    updateAuthUI();
    showAuthGate(false);
    await initNumisAfterAuth();
  }catch(e){
    console.error(e);cloudMsg(e.message||'No se pudo cargar Numis.');showAuthGate(true);
  }
}
async function cloudBootstrap(){
  NUMIS_DB.auth.onAuthStateChange((_event,session)=>{
    if(session&&!numisCloudSession)setTimeout(()=>cloudStartAfterAuth(),0);
  });
  const {data:{session}}=await NUMIS_DB.auth.getSession();
  if(!session){updateAuthUI();showAuthGate(true);return}
  numisCloudSession=session;
  numisCloudProfile=await cloudGetProfile();
  updateAuthUI();
  await initNumisAfterAuth();
}

async function initNumisAfterAuth(){
  // Keep V79's local seed/build logic as the compatibility layer.
  await restorePersistentAdminData();
  normalizePeriodDefs();cleanInvalidCountries();
  if(!catalogInitialized){
    coins.forEach(c=>{if(!c.continent)c.continent='europe';if(!('subgroup' in c))c.subgroup='';if(c.source&&/^(?:ECB|Numista)/i.test(String(c.source))){c.source='';c.sourceUrl=''};if(c.reverse&&/ecb.europa.eu\/euro\/coins\/common\/shared\/(?:new)?common_2euro_800\.jpg/i.test(c.reverse))c.reverse='';if(!Array.isArray(c.issueYears))c.issueYears=parseIssueYears('',c.period||c.year)});

async function loadFullCatalog(){
  if(catalogInitialized) return;
  try{
    const r=await fetch(FULL_CATALOG_URL,{cache:'no-store'}); if(!r.ok)throw Error('HTTP '+r.status); const data=await r.json();
    const full=data.map(normalizeFullItem).filter(Boolean);
    // 1) Canonicalizamos todos los nombres de país para que no existan pares Alemania/Deutschland, España/Spanien, etc.
    // 2) Eliminamos duplicados exactos del dataset por huella de país/año/tirada/fecha/imagen.
    const unique=[]; const fp=new Set();
    for(const c of full){const raw=c._raw||{};const f=itemFingerprint(raw);if(fp.has(f))continue;fp.add(f);delete c._raw;unique.push(c)}
    // 3) Los registros revisados manualmente de Numis tienen prioridad, también frente a la versión alemana del dataset.
    const result=[]; const used=new Set();
    for(const s of seed){result.push({...s});used.add(s.id)}
    for(const c of unique){
      if(c.year>=2022&&c.year<=2024){
        const candidates=result.filter(s=>s.country===c.country&&s.year===c.year&&!used.has(s.id));
        let best=null,bestScore=0; for(const s of candidates){const sc=coinSimilarity(c,s);if(sc>bestScore){bestScore=sc;best=s}}
        if(best&&bestScore>=0.52)continue;
      }
      // Si ya existe una ficha equivalente, no la volvemos a introducir.
      const same=result.find(s=>{const ia=normalizeText(c.obverse),ib=normalizeText(s.obverse);return (ia&&ib&&ia===ib)||coinSimilarity(c,s)>=0.46});
      if(same){if(!same.obverse&&c.obverse)same.obverse=c.obverse;if(!same.reverse&&c.reverse)same.reverse=c.reverse;if(!same.description&&c.description)same.description=c.description;continue;}
      result.push(c);
    }
    coins=result.filter(c=>c.year>=2004&&c.year<=2025&&!isInvalidCountry(c.country));
    const idsAfterFull=new Set(coins.map(c=>c.id)); for(const hc of HISTORIC_EUROPE_SEED){if(!idsAfterFull.has(hc.id))coins.push({...hc})}
    coins.forEach(c=>{if(c.source==='ECB'&&(!c.sourceUrl||String(c.sourceUrl).includes('ecb.europa.eu'))){c.source='';c.sourceUrl=''}});
    cleanInvalidCountries();
coins=coins.map(c=>({...c,motif:translateCatalogText(c.motif),description:translateCatalogText(c.description),issueDate:translateCatalogText(c.issueDate),mint:translateCatalogText(c.mint),designer:translateCatalogText(c.designer)}));
    coins.sort((a,b)=>b.year-a.year||a.country.localeCompare(b.country,'es')||a.motif.localeCompare(b.motif,'es'));
    save();
    catalogInitialized=true; localStorage.setItem("numis_catalog_initialized_v1","1");
    const n=coins.length; const notice=document.querySelector('.notice'); if(notice)notice.innerHTML='Catálogo completo cargado: <b>'+n+' fichas</b> de 2004 a 2025. Países unificados y duplicados de idioma eliminados.';
    show('home');
  }catch(e){console.warn('No se pudo cargar el catálogo completo',e);}
}

const IMG_DB='numis_images_v1'; let imgDB=null;
function openImageDB(){return new Promise((resolve,reject)=>{if(imgDB)return resolve(imgDB);let r=indexedDB.open(IMG_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>{imgDB=r.result;resolve(imgDB)};r.onerror=()=>reject(r.error)})}
async function putCoinImage(id,side,file){
  if(numisCloudSession&&numisCloudProfile?.role==='admin'){
    const path=`${encodeURIComponent(String(id))}/${side}`;
    const {error}=await NUMIS_DB.storage.from('coin-images').upload(path,file,{upsert:true,cacheControl:'31536000',contentType:file.type||'image/jpeg'});
    if(error)throw error;
    const {data}=NUMIS_DB.storage.from('coin-images').getPublicUrl(path);
    return data.publicUrl;
  }
  let db=await openImageDB();
  return new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put(file,id+'::'+side);tx.oncomplete=()=>resolve('indexeddb://'+id+'::'+side);tx.onerror=()=>reject(tx.error)})
}
async function getCoinImage(id,side){try{let db=await openImageDB();return await new Promise((resolve,reject)=>{let r=db.transaction('images').objectStore('images').get(id+'::'+side);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch{return null}}

function missingCountryStats(){
  const activeCountries=[...new Set(coins.map(c=>c.country))].filter(n=>!excludedCountries.has(n));
  return activeCountries.map(country=>{
    const all=coins.filter(c=>c.country===country&&!excludedCoins.has(c.id));
    const owned=all.filter(c=>have.includes(c.id));
    return {country,total:all.length,owned:owned.length,pct:all.length?(owned.length/all.length*100):100,missing:all.filter(c=>!have.includes(c.id))};
  }).filter(x=>x.total>0);
}
function renderMissingPage(){
  const p=uiSettings.pages, stats=missingCountryStats(), incomplete=stats.filter(x=>x.pct<100).sort((a,b)=>displayCountryName(a.country).localeCompare(displayCountryName(b.country),'es'));
  const completed=stats.filter(x=>x.pct>=100).sort((a,b)=>displayCountryName(a.country).localeCompare(displayCountryName(b.country),'es'));
  const totalMissing=incomplete.reduce((sum,x)=>sum+x.missing.length,0);
  const hall=completed.length?`<div class="admin-section"><div class="eyebrow">Completados</div><h2 style="margin:0 0 6px">Hall de la fama</h2><p class="small">Países en los que ya tienes todas las monedas activas del catálogo.</p><div class="hall-of-fame" style="margin-top:14px">${completed.map(x=>`<div class="hall-item">${flagImageHtml(x.country)}<span>${esc(displayCountryName(x.country))}</span><span>100%</span></div>`).join('')}</div></div>`:'';

}

function collectionTotal(){return Object.values(collectionMeta).reduce((sum,m)=>{const n=Number(m?.price);return sum+(Number.isFinite(n)?n:0)},0)}
function costBuckets(mode){const out={};for(const id of have){const m=collectionMeta[id]||{};const n=Number(m.price);if(!Number.isFinite(n)||n<0||!m.date)continue;const d=new Date(m.date+'T00:00:00');if(Number.isNaN(d.getTime()))continue;const key=mode==='year'?String(d.getFullYear()):String(d.getFullYear())+'-'+String(d.getMonth()+1).padStart(2,'0');out[key]=(out[key]||0)+n}return out}
function costChart(mode='month'){const data=costBuckets(mode),keys=Object.keys(data).sort();if(!keys.length)return '<div class="notice">Todavía no hay monedas de tu colección con precio y fecha. Añade esos datos al incorporar una moneda.</div>';const max=Math.max(...keys.map(k=>data[k]),1);const bars=keys.map(k=>{const h=Math.max(6,(data[k]/max)*220);const label=mode==='year'?k:k.slice(5)+'/'+k.slice(0,4);return `<div class="costbarwrap"><div class="costvalue">€ ${data[k].toFixed(2).replace('.',',')}</div><div class="costbar" style="height:${h}px"></div><div class="costlabel">${esc(label)}</div></div>`}).join('');return `<div class="costchart">${bars}</div>`}
function costCollectionCoins(){const a=coins.filter(c=>have.includes(c.id));const priceValue=id=>{const v=collectionMeta[id]?.price;return v!==undefined&&v!==null&&v!==''&&Number.isFinite(Number(v))?Number(v):null};const cmp=(x,y)=>{if(costSort==='country'){return displayCountryName(x.country).localeCompare(displayCountryName(y.country),'es')||y.year-x.year||x.motif.localeCompare(y.motif,'es')}const px=priceValue(x.id),py=priceValue(y.id);if(px===null&&py===null)return displayCountryName(x.country).localeCompare(displayCountryName(y.country),'es')||y.year-x.year;if(px===null)return 1;if(py===null)return -1;return (px-py)*(costSort==='priceAsc'?1:-1)||displayCountryName(x.country).localeCompare(displayCountryName(y.country),'es')||y.year-x.year};return a.sort(cmp)}

function refreshAdminCountryDetails(){const country=document.getElementById('country')?.value||'';const flag=document.getElementById('flag');if(flag)flag.value=flagByCountry[country]||NUMIS_COUNTRY_ISO[country]||'';refreshAdminPeriodOptions()}
function refreshAdminCountryOptions(selected=''){const group=document.getElementById('continent')?.value||'europe',sel=document.getElementById('country');if(!sel)return;const countries=countriesForGroup(group);sel.innerHTML=countries.map(n=>`<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join('');if(selected&&!countries.includes(selected)){sel.insertAdjacentHTML('afterbegin',`<option value="${esc(selected)}" selected>${esc(selected)}</option>`)}refreshAdminCountryDetails()}
function refreshAdminPeriodOptions(){const country=document.getElementById('country')?.value||'',sel=document.getElementById('periodSelect');if(!sel)return;const currentPeriod=document.getElementById('period')?.value.trim()||'';const currentEra=document.getElementById('era')?.value.trim()||'';const defs=managedPeriods(country);let html='<option value="">Sin período específico</option>';const selectedKey=currentEra&&currentPeriod?`${currentEra}|||${currentPeriod}`:'';defs.forEach(p=>{const key=`${p.era}|||${p.start}-${p.end}`;html+=`<option value="${esc(p.id)}" ${key===selectedKey?'selected':''}>${esc(p.era)} · ${p.start}–${p.end}${p.currency?' · '+esc(p.currency):''}</option>`});if(currentPeriod&&!defs.some(p=>`${p.start}-${p.end}`===currentPeriod&&p.era===currentEra)){html+=`<option value="__custom__" selected>Período actual · ${esc(currentEra?currentEra+' · ': '')}${esc(currentPeriod)}</option>`}sel.innerHTML=html}

function parseIssueYears(value,period){let src=String(value||'').trim();if(!src)src=String(period||'').trim();if(!src)return[];const out=[];for(const rawToken of src.split(',')){const token=rawToken.trim();if(!token)continue;const range=token.match(/^(?:19|20)\d{2}\s*-\s*(?:19|20)\d{2}$/);if(range){const [a,b]=token.match(/(?:19|20)\d{2}/g).map(Number);if(b>=a&&b-a<=150){for(let y=a;y<=b;y++)out.push(y)}continue}const year=token.match(/^(?:19|20)\d{2}$/);if(year)out.push(Number(year[0]))}return[...new Set(out)].sort((a,b)=>a-b)}
function issueYearsForCoin(c){if(Array.isArray(c.issueYears)&&c.issueYears.length)return c.issueYears.map(Number).filter(Boolean).sort((a,b)=>a-b);return parseIssueYears('',c.period||c.year)}

async function saveForm(oldId){let get=id=>document.getElementById(id).value.trim();let newId=get('id');let c={id:newId,continent:get('continent')||'europe',subgroup:get('subgroup')||'',country:get('country'),countryCode:flagByCountry[get('country')]||NUMIS_COUNTRY_ISO[get('country')]||'',flag:flagByCountry[get('country')]||NUMIS_COUNTRY_ISO[get('country')]||'',year:Number(get('year')),value:get('value'),motif:get('motif'),description:get('description'),mintage:Number(get('mintage'))||0,issueDate:get('issueDate'),mint:get('mint'),designer:get('designer'),obverse:get('obverse'),reverse:get('reverse'),source:get('source'),sourceUrl:get('sourceUrl'),km:get('km'),period:get('period'),era:get('era'),ruler:get('ruler'),currency:get('currency'),coinType:get('coinType'),denomination:get('denomination'),edge:get('edge'),shape:get('shape'),alignment:get('alignment'),composition:get('composition'),weight:get('weight'),diameter:get('diameter'),thickness:get('thickness'),issueYears:parseIssueYears(get('issueYears'),get('period'))};if(!c.id||!c.country||!c.year){alert('Completa ID, país y año.');return}if(oldId&&oldId!==c.id){have=have.map(x=>x===oldId?c.id:x);if(collectionMeta[oldId]){collectionMeta[c.id]=collectionMeta[oldId];delete collectionMeta[oldId]}}let i=coins.findIndex(x=>x.id===oldId);if(i>=0)coins[i]=c;else coins.push(c);catalogInitialized=true;localStorage.setItem('numis_catalog_initialized_v1','1');try{for(const side of ['obverse','reverse'])if(pendingImages[side]){const imageUrl=await putCoinImage(c.id,side,pendingImages[side]);c[side]=imageUrl||('indexeddb://'+c.id+'::'+side)}save();show('admin')}catch(e){save();alert('La ficha se guardó, pero una fotografía no pudo almacenarse en el navegador.')}}

function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.coins))throw Error();catalogInitialized=true;localStorage.setItem('numis_catalog_initialized_v1','1');coins=x.coins;deletedCatalogCoins=new Set(Array.isArray(x.deletedCatalogCoins)?x.deletedCatalogCoins:[]);coins=coins.filter(c=>!deletedCatalogCoins.has(c.id));have=Array.isArray(x.have)?x.have:[];collectionMeta=x.collectionMeta&&typeof x.collectionMeta==='object'?x.collectionMeta:{};favorites=new Set(Array.isArray(x.favorites)?x.favorites:[]);excludedCoins=new Set(Array.isArray(x.excludedCoins)?x.excludedCoins:[]);excludedCountries=new Set(Array.isArray(x.excludedCountries)?x.excludedCountries:[]);coinNotes=x.coinNotes&&typeof x.coinNotes==='object'?x.coinNotes:{};cleanInvalidCountries();save();show('admin')}catch{alert('JSON no válido')}};r.readAsText(f)}

function ucoinPeriodFor(country,start,end){const list=UCOIN_EUROPE_PERIODS[country];if(!list)return null;const candidates=list.filter(x=>x[2]>=start&&x[1]<=end&&x[0]!=='ECU');if(!candidates.length)return null;candidates.sort((a,b)=>Math.abs(a[1]-start)-Math.abs(b[1]-start));return candidates[0]}
function yearsFromRange(start,end){const a=Number(start),b=Number(end);if(!Number.isFinite(a)||!Number.isFinite(b)||b<a||b-a>150)return [];const out=[];for(let y=a;y<=b;y++)out.push(y);return out}

function buildHistoricalEuropeCoins(){const out=[];Object.entries(EUROPE_CIRCULATING_SPECS).forEach(([country,specs])=>{const periods=UCOIN_EUROPE_PERIODS[country]||[];periods.filter(p=>p[2]>=1900&&p[0]!=='ECU'&&!(NUMIS_EURO_COUNTRIES.includes(country)&&String(p[0]||'').trim()==='Euro')).forEach((up,pi)=>{const [era,pStart,pEnd]=up;let best=null,bestScore=-1;specs.forEach((sp,si)=>{const m=(String(sp[2]).match(/\d{4}/g)||[]).map(Number);if(m.length<1)return;const a=m[0],b=m[1]||m[0];const overlap=Math.max(0,Math.min(b,pEnd)-Math.max(a,pStart)+1);if(overlap>bestScore){best={sp,si};bestScore=overlap}});if(!best)return;const sp=best.sp;const currency=sp[1],denoms=sp[4]||[];denoms.forEach((den,i)=>{const id=`HIST-${NUMIS_COUNTRY_ISO[country]||'XX'}-${pi}-${i}-${String(den).replace(/[^A-Za-z0-9]+/g,'-').toUpperCase()}`;const issueYears=yearsFromRange(pStart,pEnd);const year=issueYears[0]||pStart;out.push({id,continent:'europe',subgroup:'',country,countryCode:NUMIS_COUNTRY_ISO[country]||'',flag:flagByCountry[country]||'',year,value:den,motif:`${den} · ${currency}`,description:'Moneda circulante normal. Ficha histórica sin fotografía.',mintage:0,issueDate:'',mint:'',designer:'',obverse:'',reverse:'',source:'',sourceUrl:'',km:'',period:`${pStart}-${pEnd}`,era,ruler:era,currency,coinType:'Moneda circulante normal',denomination:den,edge:'',shape:'Circular',alignment:'Moneda',composition:'',weight:'',diameter:'',thickness:'',issueYears});});});});return out}
function applyRequestedPeriodCorrections(){
  const remove=(country,pred)=>{if(UCOIN_EUROPE_PERIODS[country])UCOIN_EUROPE_PERIODS[country]=UCOIN_EUROPE_PERIODS[country].filter(p=>!pred(p))};
  const removeNames=(country,names)=>remove(country,p=>names.includes(String(p[0]).trim()));
  // Nunca usar "Euro" como nombre de período histórico: el nombre oficial es Unión Europea (Euro).
  Object.keys(UCOIN_EUROPE_PERIODS).forEach(country=>{if(UCOIN_EUROPE_PERIODS[country])UCOIN_EUROPE_PERIODS[country]=UCOIN_EUROPE_PERIODS[country].filter(p=>String(p[0]).trim()!=='Euro')}); UCOIN_EUROPE_PERIODS['Kosovo']=[];
  // Eliminar períodos de URSS/Yugoslavia de los países actuales; se añadirán como estados extintos por separado.
  Object.keys(UCOIN_EUROPE_PERIODS).forEach(country=>remove(country,p=>/Unión Soviética|RSFSR|Yugoslavia/i.test(String(p[0]||''))));
  removeNames('Grecia',['Rey Jorge I']);
  removeNames('Hungría',['Corona austrohúngara']);
  removeNames('Italia',['Reino de Italia','Rey Víctor Manuel III']);
  removeNames('Noruega',['Rey Óscar II']);
  removeNames('Países Bajos',['Reina Guillermina']);
  removeNames('Reino Unido',['Reina Victoria']);
  removeNames('Rusia',['Zar Nicolás II','Zar Nicolas II']);
  removeNames('Suecia',['Rey Oscar II','Rey Óscar II']);
  // Períodos indicados para Portugal.
  UCOIN_EUROPE_PERIODS['Portugal']=[['Unión Europea (Euro)',2002,2026],['República Portuguesa',1986,2001],['República Portuguesa',1969,1986],['República Portuguesa',1910,1969]];
  // Finlandia: dos tramos de República de Finlandia (Suomi).
  UCOIN_EUROPE_PERIODS['Finlandia']=[['Unión Europea (Euro)',1999,2026],['República de Finlandia (Suomi)',1963,2001],['República de Finlandia (Suomi)',1918,1962]];
  // Rumanía: nomenclatura y años solicitados.
  if(UCOIN_EUROPE_PERIODS['Rumanía'])UCOIN_EUROPE_PERIODS['Rumanía']=UCOIN_EUROPE_PERIODS['Rumanía'].map(p=>String(p[0]).trim()==='Reino de Rumania'?['Reino de Rumanía',1930,1947]:p);
  // Suiza queda dividida en dos períodos; se evita duplicar exactamente el mismo rango.
  UCOIN_EUROPE_PERIODS['Suiza']=[['Confederación Helvética',1968,2026],['Confederación Helvética',1917,1967]];
  UCOIN_EUROPE_PERIODS['Turquía']=[['República de Turquía',2005,2026],['República de Turquía',2001,2004],['República de Turquía',1981,2000],['República de Turquía',1934,1980]];
  UCOIN_EUROPE_PERIODS['Transnistria']=[['República Moldava Pridnestroviana',2000,2026]];
  // Alemania y Austria ya no deben conservar los períodos eliminados.
  removeNames('Alemania',['Imperio alemán']);
  removeNames('Austria',['Corona austrohúngara']);
  removeNames('Bélgica',['Euro']);
  removeNames('España',['Euro','Juan Carlos','Rey Juan Carlos I','Rey Juan Carlos I (1975-2001)','Rey Alfonso XIII']);
  Object.keys(UCOIN_EUROPE_PERIODS).forEach(country=>UCOIN_EUROPE_PERIODS[country].sort((a,b)=>b[2]-a[2]||b[1]-a[1]));
}
applyRequestedPeriodCorrections();

// V65: el período monetario del euro se denomina simplemente "Euro".
// Se mantiene como período del catálogo general, mientras que las ocho fichas
// concretas viven en el subgrupo independiente "circulating".
function normalizeEuroPeriodNames(){
  Object.keys(UCOIN_EUROPE_PERIODS).forEach(country=>{
    UCOIN_EUROPE_PERIODS[country]=(UCOIN_EUROPE_PERIODS[country]||[]).map(p=>{
      const q=p.slice();
      if(String(q[0]||'').trim()==='Unión Europea (Euro)') q[0]='Euro';
      return q;
    });
  });
}
normalizeEuroPeriodNames();

const EURO_CIRCULATING_DENOMS=[
  ['1 céntimo','0,01 €',1],['2 céntimos','0,02 €',2],['5 céntimos','0,05 €',3],
  ['10 céntimos','0,10 €',4],['20 céntimos','0,20 €',5],['50 céntimos','0,50 €',6],
  ['1 euro','1 €',7],['2 euros','2 €',8]
];
function buildEuroCirculatingCoins(){
  return NUMIS_EURO_COUNTRIES.flatMap(country=>{
    const euroPeriod=(UCOIN_EUROPE_PERIODS[country]||[]).find(p=>String(p[0]||'').trim()==='Euro');
    const euroStart=euroPeriod?Number(euroPeriod[1]):2002;
    const euroEnd=euroPeriod?Number(euroPeriod[2]):2026;
    return EURO_CIRCULATING_DENOMS.map(([den,value,rank])=>({
      id:`EURO-CIRC-${NUMIS_COUNTRY_ISO[country]||country.replace(/[^A-Za-z0-9]+/g,'-').toUpperCase()}-${rank}`,
      continent:'europe',subgroup:'circulating',country,countryCode:NUMIS_COUNTRY_ISO[country]||'',flag:flagByCountry[country]||'',
      year:euroEnd,value,motif:den,description:'Moneda de euro destinada a la circulación. Ficha base de la denominación nacional.',
      mintage:0,issueDate:'',mint:'',designer:'',obverse:'',reverse:'',source:'',sourceUrl:'',km:'',
      period:`${euroStart}-${euroEnd}`,era:'Euro',ruler:'Euro',currency:'Euro',coinType:'Euro circulante',denomination:den,euroRank:rank,edge:'',shape:'Redonda',alignment:'Moneda',composition:'',weight:'',diameter:'',thickness:'',issueYears:[euroEnd]
    }));
  });
}

function cleanLegacyEuroCirculatingCoins(){
  const allowed=new Set(EURO_CIRCULATING_DENOMINATIONS.map(x=>x[0].toLowerCase()));
  coins=coins.filter(c=>{
    const isEuroLegacy=NUMIS_EURO_COUNTRIES.includes(c.country)&&String(c.currency||'').trim().toLowerCase()==='euro'&&allowed.has(String(c.denomination||c.value||'').trim().toLowerCase())&&!isCommemorative2(c);
    return !isEuroLegacy || c.subgroup==='circulating';
  });
}

function mergeHistoricalEuropeCoins(){
  const blockedPattern=/Unión Soviética|RSFSR|Yugoslavia/i;
  coins=coins.filter(c=>{
    const country=String(c.country||'');
    const names=[c.era,c.period,c.ruler,c.coinType].map(v=>String(v||'').trim());
    if(c.subgroup==='circulating')return false;
    if(blockedPattern.test(names.join(' ')))return false;
    if(country==='Alemania'&&names.some(v=>v==='Imperio alemán'||v==='Imperio Aleman'||v==='Imperio alemán 1922'))return false;
    if(country==='Austria'&&names.some(v=>v==='Corona austrohúngara'))return false;
    if(names.some(v=>v==='Euro'))return false;
    if(country==='España'&&names.some(v=>v==='Euro'||v==='Juan Carlos'||v==='Rey Juan Carlos I'||v==='Rey Juan Carlos I (1975-2001)'||v==='Rey Alfonso XIII'))return false;
    return !String(c.id||'').startsWith('HIST-');
  });

  Object.keys(UCOIN_EUROPE_PERIODS).forEach(country=>{
    UCOIN_EUROPE_PERIODS[country]=UCOIN_EUROPE_PERIODS[country].filter(p=>
      !blockedPattern.test(String(p[0]||'')) &&
      !((country==='Alemania')&&String(p[0]).trim()==='Imperio alemán') &&
      !((country==='Austria')&&String(p[0]).trim()==='Corona austrohúngara')
    );
  });

  // El subgrupo de euros circulantes es independiente del catálogo histórico:
  // se borra entero y se reconstruyen exactamente 8 fichas por país.
  // El subgrupo de euros circulantes se reconstruye desde cero en cada arranque.
  // No se conserva ninguna ficha previa de euro para evitar duplicados o monedas históricas mezcladas.
  coins=coins.filter(c=>{
    if(c.subgroup==='circulating')return false;
    if(NUMIS_EURO_COUNTRIES.includes(c.country)&&!isCommemorative2(c)&&String(c.currency||'').trim().toLowerCase()==='euro')return false;
    return true;
  });
  const added=buildHistoricalEuropeCoins().concat(buildEuroCirculatingCoins());
  added.forEach(c=>{
    if(c.country==='Albania'&&c.denomination==='1 lek'&&c.era==='República de Albania'){
      c.issueYears=[2008,2009,2010,2011,2012,2013];c.year=2008;c.period='1992-2024';c.km='KM# 75a';
      c.composition='Acero chapado en cobre';c.weight=3;c.diameter=18.1;c.thickness=1.64;c.edge='Liso';c.shape='Redonda';c.alignment='Medalla (0°)';c.motif='1 lek · República de Albania';
    }
  });
  const ids=new Set(coins.map(c=>c.id));
  let n=0;
  const euroIds=new Set();
  added.forEach(c=>{
    if(c.subgroup==='circulating'){
      const k=`${c.country}|${c.euroRank}`;
      if(euroIds.has(k))return;
      euroIds.add(k);
    }
    if(!ids.has(c.id)){coins.push(c);ids.add(c.id);n++;}
  });
  catalogInitialized=true;
  localStorage.setItem('numis_catalog_initialized_v1','1');
  save();
  return n;
}

<script>
/* V46: map presentation overrides */
(function(){
  const oldRender = window.renderCollectionMap;
  if(typeof oldRender !== 'function') return;
  window.renderCollectionMap = function(scope, rootId, ariaLabel){
    const r = oldRender.apply(this, arguments);
    setTimeout(function(){
      const root=document.getElementById(rootId);
      if(!root) return;
      const svg=root.querySelector('svg');
      if(!svg) return;
      // America: a little less zoom.
      if(scope==='america'){
        const vb=svg.getAttribute('viewBox');
        if(vb){
          const a=vb.trim().split(/\s+/).map(Number);
          if(a.length===4){
            const [x,y,w,h]=a, padX=w*0.045, padY=h*0.045;
            svg.setAttribute('viewBox',[x-padX,y-padY,w+padX*2,h+padY*2].join(' '));
          }
        }
      }
      // World map: hide Antarctica and give the remaining world more visual weight.
      if(scope==='world'){
        svg.querySelectorAll('path').forEach(path=>{
          const n=(path.getAttribute('aria-label')||path.getAttribute('data-name')||path.__data__?.properties?.NAME||'').toLowerCase();
          if(n.includes('antarctica')) path.style.display='none';
        });
      }
    },0);
    return r;
  };
})();
</script>
